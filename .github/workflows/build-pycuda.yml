name: PyCUDA

permissions: {}

on:
  pull_request:
    branches: [main, "charlie/gpu-audit-*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan PyCUDA build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read # for actions/checkout
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Generate build matrix
        id: generate-matrix
        run: |
          echo "matrix=$(uv run --script plan-matrix.py)" >> $GITHUB_OUTPUT
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheels:
    name: Build Wheel
    needs: [plan-matrix]
    runs-on: ${{ matrix.RUNNER }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}

    steps:
      - name: Determine PyCUDA version
        id: pycuda-version
        run: |
          # Extract PyCUDA version from tag. Tags can be either:
          # - v2025.1.2 (legacy format; maps directly to PyCUDA version)
          # - v2025.1.2-r1 (new format; strip -rN suffix to get PyCUDA version)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUTS_RELEASE_TAG}"
            # Remove -rN suffix if present
            PYCUDA_VERSION=$(sed -E 's/-r[0-9]+$//' <<<"${TAG}")
          else
            PYCUDA_VERSION="v2026.1"
          fi
          echo "version=${PYCUDA_VERSION}" >> $GITHUB_OUTPUT
          echo "Using PyCUDA version: ${PYCUDA_VERSION}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUTS_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Checkout PyCUDA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: inducer/pycuda
          ref: ${{ steps.pycuda-version.outputs.version }}
          submodules: recursive
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.22"
          enable-cache: false

      - name: Set CUDA versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ matrix.MATRIX_CUDA_VERSION }})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ matrix.MATRIX_PYTHON_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_CUDA_VERSION=$(echo ${{ matrix.MANYLINUX_CUDA_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_CUDA_COMPAT_VERSION=$(echo ${{ matrix.MANYLINUX_CUDA_COMPAT_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_GLIBC_VERSION=$(echo ${{ matrix.MANYLINUX_GLIBC_VERSION }})" >> $GITHUB_ENV
          echo "CI_AUDITWHEEL_EXCLUDES=$(echo ${{ matrix.CI_AUDITWHEEL_EXCLUDES }})" >> $GITHUB_ENV

      - name: Provide Python 3.15 to the CUDA image
        if: matrix.python-version == '3.15'
        run: |
          uv python install --install-dir "${RUNNER_TEMP}/pycuda-python" 3.15
          pycuda_python=$(UV_PYTHON_INSTALL_DIR="${RUNNER_TEMP}/pycuda-python" uv python find --managed-python 3.15)
          pycuda_python_prefix=$(dirname "$(dirname "${pycuda_python}")")
          echo "CIBW_CONTAINER_ENGINE=docker; create_args: --volume ${pycuda_python_prefix}:/opt/python/cp315-cp315" >> "${GITHUB_ENV}"

      - name: Install cibuildwheel
        run: |
          uv venv --python 3.13
          uv pip install cibuildwheel

      - name: Build wheels for PyCUDA cu${{ matrix.cuda-version }}
        run: |
          .venv/bin/cibuildwheel --output-dir dist
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.target-arch }}
          CIBW_BUILD: cp${{ env.MATRIX_PYTHON_VERSION }}-*64
          CIBW_MANYLINUX_X86_64_IMAGE: pytorch/manylinux2_28-builder:cuda${{ env.MANYLINUX_CUDA_VERSION }}
          CIBW_MANYLINUX_AARCH64_IMAGE: pytorch/manylinuxaarch64-builder:cuda${{ env.MANYLINUX_CUDA_VERSION }}
          CIBW_BEFORE_ALL: >
            curl -LsSf https://astral.sh/uv/install.sh | sh
          CIBW_BEFORE_BUILD_LINUX: >
            if [ "${PYCUDA_VERSION}" = "v2025.1.3" ]; then NUMPY_REQUIREMENT="numpy>=1.24,<2.3"; else NUMPY_REQUIREMENT="numpy>=1.24"; fi &&
            uv pip install setuptools wheel "${NUMPY_REQUIREMENT}" mako pytools &&
            bash build_scripts/prepare_for_build.sh ${{ steps.pycuda-version.outputs.version }}
          CIBW_ENVIRONMENT: >
            PYCUDA_VERSION=${{ steps.pycuda-version.outputs.version }}
            PATH=$PATH:/root/.local/bin
            CUDA_ROOT="/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}"
            CUDA_HOME="/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}"
            LIBRARY_PATH="/usr/lib64"
            LD_LIBRARY_PATH="/usr/lib64:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/lib64:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/targets/${{ matrix.target-arch }}-linux/lib:/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/extras/CUPTI/lib64"
            LDFLAGS="-ldl -L/usr/local/cuda-${{ env.MANYLINUX_CUDA_VERSION }}/targets/${{ matrix.target-arch }}-linux/lib/stubs"
            AUDITWHEEL_PLAT="manylinux_${{ env.MANYLINUX_GLIBC_VERSION }}_$(uname -m)"
            MATRIX_CUDA_VERSION=${{ env.MATRIX_CUDA_VERSION }}
            MANYLINUX_CUDA_VERSION=${{ env.MANYLINUX_CUDA_VERSION }}
            MATRIX_PYTHON_VERSION=${{ env.MATRIX_PYTHON_VERSION }}
            MAX_JOBS=8
            UV_PYTHON=/opt/python/cp${{ env.MATRIX_PYTHON_VERSION }}-cp${{ env.MATRIX_PYTHON_VERSION }}/bin/python
            CI_AUDITWHEEL_EXCLUDES="${{ env.CI_AUDITWHEEL_EXCLUDES }}"
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w /tmp/cibuildwheel/repaired_wheel {wheel} ${CI_AUDITWHEEL_EXCLUDES}"
          CIBW_BUILD_FRONTEND: "build[uv]; args: --no-isolation"

      - name: Embed metadata into wheel
        run: |
          for wheel in dist/*.whl; do
            uv run --script build_scripts/embed_patches.py "$wheel" "build_scripts/patches/${PYCUDA_VERSION}" \
              --source-repo "https://github.com/inducer/pycuda" \
              --source-tag "${PYCUDA_VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --build-repo "https://github.com/astral-sh-build/build-pycuda" \
              --build-commit "${BUILD_COMMIT}" \
              --license-expression "MIT AND Apache-2.0 AND Python-2.0 AND LicenseRef-NVIDIA-CUDA-Toolkit" \
              --license-file "LICENSE:LICENSE" \
              --license-file "build_scripts/licenses/nvidia-cuda-toolkit/EULA.html:third-party/nvidia-cuda-toolkit/EULA.html" \
              --license-file "build_scripts/licenses/nvidia-cuda-toolkit/SOURCE.txt:third-party/nvidia-cuda-toolkit/SOURCE.txt"
          done
        env:
          PYCUDA_VERSION: ${{ steps.pycuda-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log Built Wheels
        run: |
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{env.wheel_name}}
          path: dist/${{env.wheel_name}}
          if-no-files-found: error

  create-release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release create "${RELEASE_TAG}" ./dist/*.whl
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --notes ""
          --repo "${GITHUB_REPOSITORY}"
